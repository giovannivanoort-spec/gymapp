<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Geen verbinding · Spotter</title>
    <!--
      Offline-scherm van de Android-app (Capacitor server.errorPath). Wordt getoond als de site
      (server.url) niet geladen kan worden. Deze pagina draait lokaal op https://localhost, zonder
      Capacitor-plugins, en heeft geen netwerk nodig: alles staat inline.
      Het adres van de site staat in app-url.js (gemaakt door scripts/native-app-url.mjs bij npm run cap:sync).
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --surface: #15181d;
        --surface-2: #1d2128;
        --line: #2a2f37;
        --ink: #eceef1;
        --muted: #9aa1ab;
        --accent: #c8f53a;
        --accent-ink: #12160a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
        background:
          radial-gradient(1200px 500px at 50% -200px, rgba(200, 245, 58, 0.07), transparent 70%),
          var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        width: 100%;
        max-width: 22rem;
        padding: 1.5rem;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        background: var(--surface);
        text-align: center;
      }
      .logo {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        line-height: 1.3;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        opacity: 0.6;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .status {
        margin-top: 1rem;
        min-height: 1.2em;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#1d2128" />
        <g fill="#c8f53a">
          <rect x="96" y="176" width="48" height="160" rx="14" />
          <rect x="368" y="176" width="48" height="160" rx="14" />
          <rect x="152" y="208" width="36" height="96" rx="10" />
          <rect x="324" y="208" width="36" height="96" rx="10" />
          <rect x="188" y="240" width="136" height="32" rx="8" />
        </g>
      </svg>
      <h1>Spotter kan nu niet laden</h1>
      <p>Er is geen verbinding met internet, of de server reageert niet. Controleer je wifi of mobiele data en probeer het opnieuw.</p>
      <button type="button" id="retry">Opnieuw proberen</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="app-url.js"></script>
    <script>
      (function () {
        // Valt terug op het standaardadres als app-url.js ontbreekt.
        var url = window.SPOTTER_APP_URL || "https://myspotter.nl";
        var button = document.getElementById("retry");
        var status = document.getElementById("status");

        function retry() {
          if (button.disabled) return;
          button.disabled = true;
          status.textContent = "Bezig met verbinden…";
          window.location.replace(url);
          // Lukt het niet, dan laadt de app deze pagina opnieuw; anders na een paar seconden weer vrijgeven.
          setTimeout(function () {
            button.disabled = false;
            status.textContent = navigator.onLine ? "Nog steeds geen verbinding met Spotter." : "Je bent offline.";
          }, 8000);
        }

        button.addEventListener("click", retry);
        // Verbinding terug: vanzelf opnieuw proberen.
        window.addEventListener("online", retry);
        if (!navigator.onLine) status.textContent = "Je bent offline.";
      })();
    </script>
  </body>
</html>
